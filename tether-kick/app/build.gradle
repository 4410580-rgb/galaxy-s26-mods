plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tetherkick'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tetherkick'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // 本体（toggle）と、ルーチン検知用の補助アプリ2つ（on / off）を別パッケージでビルド
    flavorDimensions = ['role']
    productFlavors {
        toggle { dimension 'role'; applicationIdSuffix '.toggle' }
        on     { dimension 'role'; applicationIdSuffix '.on' }
        off    { dimension 'role'; applicationIdSuffix '.off' }
    }

    // 固定の鍵で署名する（毎回同じ署名になるので、次回以降は上書きインストールできる）
    signingConfigs {
        fixed {
            storeFile file('release.keystore')
            storePassword 'tetherkick'
            keyAlias 'tetherkick'
            keyPassword 'tetherkick'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
