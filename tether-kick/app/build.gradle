plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tetherkick'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tetherkick.toggle'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // 固定の鍵で署名する（毎回同じ署名になるので、次回以降は上書きインストールできる）
    signingConfigs {
        fixed {
            storeFile file('release.keystore')
            storePassword 'tetherkick'
            keyAlias 'tetherkick'
            keyPassword 'tetherkick'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
